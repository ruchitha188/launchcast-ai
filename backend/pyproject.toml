[project]
name = "launchcast-backend"
version = "0.1.0"
description = "LaunchCast AI - New-Product Cold-Start Demand Forecasting and Inventory Optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
